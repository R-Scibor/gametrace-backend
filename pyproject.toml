[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's DI idiom is a function call in a default argument by design.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Security",
]

[tool.mypy]
python_version = "3.11"
# celery, discord.py and firebase-admin ship no usable stubs.
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
# Suppressions rot silently once the upstream types improve; fail on stale ones.
warn_unused_ignores = true
