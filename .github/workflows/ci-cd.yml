name: CI/CD

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'tests/**'
      - 'alembic/**'
      - 'requirements.txt'
      - 'pyproject.toml'
      - 'scripts/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.github/workflows/ci-cd.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'tests/**'
      - 'alembic/**'
      - 'requirements.txt'
      - 'pyproject.toml'
      - 'scripts/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.github/workflows/ci-cd.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: gametrace_test
          POSTGRES_USER: gametrace_user
          POSTGRES_PASSWORD: gametrace_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://gametrace_user:gametrace_pass@localhost:5432/gametrace_test
      REDIS_URL: redis://localhost:6379/0
      COVERS_DIR: /tmp/gametrace_covers

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Lint (ruff)
        run: ruff check app tests alembic scripts

      - name: Type check (mypy)
        run: mypy app tests alembic scripts

      - name: Run tests
        run: pytest

  build-and-publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6 

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract Dynamic Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: gametrace-backend:local-scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GIT_SHA=${{ github.sha }}
            APP_VERSION=${{ steps.meta.outputs.version || 'prod' }}
      
      - name: Run Trivy Vulnerability Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: gametrace-backend:local-scan
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
      
      - name: Build and Push Image to GHCR
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GIT_SHA=${{ github.sha }}
            APP_VERSION=${{ steps.meta.outputs.version || 'prod' }}


  deploy:
    name: Deploy to Homelab
    needs: build-and-publish
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: self-hosted

    steps:
      - name: Pull Latest Image and Restart Stack
        run: |
          cd /home/endmin/homelab/gametrace-backend
          docker compose pull
          docker compose up -d --remove-orphans

      - name: Notify failure
        if: failure()
        run: |
          if [ -x /home/endmin/homelab/ntfy/notify.sh ]; then
            /home/endmin/homelab/ntfy/notify.sh --fail --title "CI fail gametrace-backend" "Job 'deploy' failed on ${{ github.ref_name }}" --click "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
            python3 /home/endmin/homelab/ntfy/hooks/watch.py --mark-seen R-Scibor/gametrace-backend "${{ github.run_id }}" || true
          fi

